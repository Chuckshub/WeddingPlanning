<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mandy & Charlie — Guest Planner</title>
  <meta name="description" content="A bright, wedding-themed guest planner for Mandy & Charlie." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E💒%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <!-- Tabulator (open-source table library) for the guest planner (light theme) -->
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@5.6.0/dist/css/tabulator.min.css" />
  <script src="https://unpkg.com/tabulator-tables@5.6.0/dist/js/tabulator.min.js"></script>
</head>
<body>
  <header class="site-header light">
    <nav class="nav container">
      <div class="brand">
        <span class="logo" aria-hidden="true">💐</span>
        <span class="brand-text serif">Mandy & Charlie</span>
      </div>
      <div class="nav-aux">
        <span class="date serif" aria-label="Wedding date">June 14, 2026 • Austin, TX</span>
      </div>
    </nav>
  </header>

  <main>
    <!-- Analyst toolbar with KPI chips and controls -->
    <section class="toolbar section">
      <div class="container">
        <div class="toolbar-row">
          <div class="kpis">
            <div class="kpi"><div class="kpi-label">Guests</div><div class="kpi-value" id="kpi-total">0</div></div>
            <div class="kpi"><div class="kpi-label">Families</div><div class="kpi-value" id="kpi-families">0</div></div>
            <div class="kpi"><div class="kpi-label">Plus‑Ones</div><div class="kpi-value" id="kpi-plus">0</div></div>
            <div class="kpi"><div class="kpi-label">RSVP ✓</div><div class="kpi-value" id="kpi-yes">0</div></div>
            <div class="kpi"><div class="kpi-label">No / Pending</div><div class="kpi-value" id="kpi-no">0</div></div>
          </div>
          <div class="tools">
            <button id="add-guest" class="btn primary">Add guest</button>
            <button id="export-guests" class="btn">Export</button>
            <label class="btn outline file">
              Import CSV
              <input id="import-guests" type="file" accept="text/csv" hidden />
            </label>
            <select id="density" class="density">
              <option value="cozy">Cozy</option>
              <option value="compact">Compact</option>
            </select>
          </div>
        </div>
        <div class="views">
          <span class="views-label">Saved views:</span>
          <button data-view="all" class="chip active">All</button>
          <button data-view="bride" class="chip">Bride side</button>
          <button data-view="groom" class="chip">Groom side</button>
          <button data-view="plus" class="chip">Plus‑ones</button>
          <button data-view="unassigned" class="chip">No table</button>
          <label class="inline" style="margin-left:auto">
            <input id="group-by" type="checkbox" /> Group by family
          </label>
          <label class="inline">
            <input id="group-by-table" type="checkbox" /> Group by table
          </label>
        </div>
      </div>
    </section>

    <section class="planner section">
      <div class="container">
        <div id="guest-table" class="guest-table" aria-live="polite"></div>
        <p class="hint">Tip: Shift‑click to multi‑sort. Use the column menu to show/hide fields.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer light">
    <div class="container">
      <p class="muted">Made with love for Mandy & Charlie.</p>
    </div>
  </footer>

  <!-- Add/Edit Guest Modal -->
  <dialog id="guest-modal" class="modal light">
    <form method="dialog" class="modal-box" id="guest-form">
      <header class="modal-header">
        <h3 id="modal-title" class="serif">Add guest</h3>
        <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
      </header>
      <div class="modal-body">
        <div class="grid-2">
          <label class="field">
            <span>Full name</span>
            <input name="name" required placeholder="Guest name" />
          </label>
          <label class="field">
            <span>Side</span>
            <select name="side">
              <option value="bride">Bride</option>
              <option value="groom">Groom</option>
              <option value="both">Both</option>
            </select>
          </label>
          <label class="field">
            <span>Relationship</span>
            <input name="relationship" placeholder="Friend, Family, Coworker…" />
          </label>
          <label class="field">
            <span>Family name (for grouping)</span>
            <input name="familyName" placeholder="e.g., Smith" />
          </label>
          <label class="field">
            <span>Table #</span>
            <input name="tableNumber" type="number" min="0" placeholder="0 = unassigned" />
          </label>
          <label class="field">
            <span>Plus‑ones allowed</span>
            <input name="plusOnesAllowed" type="number" min="0" value="0" />
          </label>
          <label class="field full">
            <span>Plus one name (if any)</span>
            <input name="plusOneName" placeholder="Name of plus one" />
          </label>
          <label class="field full">
            <span>Notes</span>
            <textarea name="notes" rows="2" placeholder="Dietary needs, seating notes, etc."></textarea>
          </label>
        </div>
      </div>
      <footer class="modal-footer">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn primary" id="save-guest" value="default">Save</button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="./planner.js"></script>
</body>
</html>
